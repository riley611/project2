name: CI Security and Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Pylint
      run: |
        # Runs pylint on your source directory, aiming for a 10/10 score
        pylint src/

    - name: Run Bandit Security Scan
      run: |
        # Runs bandit recursively to check for security vulnerabilities
        bandit -r src/